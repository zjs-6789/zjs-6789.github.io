        /* 移动端适配: 字体稍稍缩小避免重叠严重 */
        @media (max-width: 700px) {

<body>

<!-- 视频容器：B站官方视频 “关注塔菲谢谢喵☆”  -->
<div class="video-container" id="videoContainer">
    <iframe 
        class="bilibili-frame"
        id="biliIframe"

        allow="autoplay; fullscreen"
        allowfullscreen>

</div>

<!-- 粉色大字乱飞的容器 -->
<div class="floating-words-container" id="floatingContainer"></div>

<!-- 夸张关闭按钮 & 装饰性小尾巴 -->
<button class="taffy-close-btn" id="taffyCloseBtn">💗 关掉视频 · 塔菲降临 💗</button>
<div class="corner-note">🐱 关注塔菲谢谢喵 ~ 满屏粉色能量</div>

<script>
    (function() {
        // ----------------------------------------------
        // 塔菲主题核心：极度夸张的粉色文字库
        const MESSAGES = [
            "关注塔菲喵 💖",
            "关注塔菲谢谢喵 🎀",
            "塔菲爱你哟 🐾",
            "立刻关注塔菲喵✨",
            "塔菲最最可爱!🌸",
            "关注塔菲谢谢喵🍬",
            "塔菲公主降临💕",
            "喵喵喵~关注塔菲",
            "塔菲带你飞🐱🎈",
            "塔菲脑婆!❤️",
            "关注塔菲不迷路",
            "塔菲超绝かわいい",
            "每只喵都要关注塔菲",
            "塔菲能量注入💗",
            "谢谢喵~关注喵",
            "塔菲踩踩👣关注喵",
            "塔菲永相随 💓",
            "关注塔菲谢谢喵⭐",
            "💖塔菲天下第一💖",
            "🐱关注塔菲谢谢喵🐱"
        ];
        
        // 配置数量: 满屏乱飞数量足够夸张 (80个大字)
        const WORD_COUNT = 80;
        
        let wordsData = [];           // 存储每个字的DOM + 运动数据
        let animFrameId = null;
        let containerWidth = window.innerWidth;
        let containerHeight = window.innerHeight;
        let isPartyActive = false;    // 是否已经开启大字狂欢
        let resizeFlag = false;
        
        const videoContainer = document.getElementById('videoContainer');
        const floatingContainer = document.getElementById('floatingContainer');
        const closeBtn = document.getElementById('taffyCloseBtn');
        
        // 辅助: 随机范围
        function randomRange(min, max) {
            return min + Math.random() * (max - min);
        }
        
        // 随机获取一句疯狂标语
        function getRandomPhrase() {
            return MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
        }
        
        // 随机尺寸等级 (让层次更夸张)
        function getRandomSizeClass() {
            const r = Math.random();
            if (r < 0.55) return '';        // 正常大小 (2.8rem)
            if (r < 0.8) return 'big';       // 大号 (4rem)
            return 'giant';                  // 巨无霸 (5.8rem)
        }
        
        // 生成满屏飞舞大字 (摧毁旧的重建)
        function generateFloatingWords() {
            if (!floatingContainer) return;
            floatingContainer.innerHTML = '';
            wordsData = [];
            
            for (let i = 0; i < WORD_COUNT; i++) {
                const wordEl = document.createElement('div');
                wordEl.className = 'fly-word';
                const sizeClass = getRandomSizeClass();
                if (sizeClass) wordEl.classList.add(sizeClass);
                
                // 为了让每个字独一无二，渐变风格再微调(更粉嫩)
                const gradientAngle = 120 + Math.random() * 60;
                wordEl.style.background = `linear-gradient(${gradientAngle}deg, #FF80CC, #FF3399, #FFB3E6)`;
                wordEl.style.backgroundClip = 'text';
                wordEl.style.webkitBackgroundClip = 'text';
                wordEl.style.color = 'transparent';
                wordEl.style.textShadow = `0 0 16px #FF66AA, 0 0 30px #FF3399, 2px 4px 12px black`;
                
                wordEl.innerText = getRandomPhrase();
                
                // 随机初始位置 (全屏任意)
                const initX = Math.random() * containerWidth;
                const initY = Math.random() * containerHeight;
                wordEl.style.left = `${initX}px`;
                wordEl.style.top = `${initY}px`;
                wordEl.style.position = 'absolute';
                
                // 随机速度 (激烈乱飞，有快有慢)
                const vx = randomRange(-1.6, 1.6);
                const vy = randomRange(-1.6, 1.6);
                // 随机旋转速度
                const rotSpeed = randomRange(-1.8, 1.8);
                const initRot = randomRange(-12, 12);
                wordEl.style.transform = `rotate(${initRot}deg)`;
                
                floatingContainer.appendChild(wordEl);
                
                wordsData.push({
                    dom: wordEl,
                    x: initX,
                    y: initY,
                    vx: vx,
                    vy: vy,
                    rotation: initRot,
                    rotSpeed: rotSpeed,
                    width: wordEl.offsetWidth,
                    height: wordEl.offsetHeight
                });
            }
            
            // 二次修正宽度 (因为部分字体加载后偏移)
            setTimeout(() => {
                for (let w of wordsData) {
                    if (w.dom) {
                        w.width = w.dom.offsetWidth;
                        w.height = w.dom.offsetHeight;
                    }
                }
            }, 50);
        }
        
        // 更新每一帧位置 (物理乱飞 + 边界碰撞 + 旋转)
        function updateMovement() {
            if (!floatingContainer || wordsData.length === 0) return;
            let needContinue = true;
            for (let obj of wordsData) {
                if (!obj.dom) continue;
                let newX = obj.x + obj.vx;
                let newY = obj.y + obj.vy;
                const elemW = obj.width || obj.dom.offsetWidth || 80;
                const elemH = obj.height || obj.dom.offsetHeight || 40;
                
                // 边界反弹 + 极其调皮增加随机加速度让视觉效果更炸
                if (newX <= 0) {
                    newX = 2;
                    obj.vx = Math.abs(obj.vx) * (0.92 + Math.random() * 0.2);
                    obj.vx = Math.min(obj.vx, 2.5);
                    // 反弹时稍微改变Y速度增加凌乱感
                    obj.vy = obj.vy + (Math.random() - 0.5) * 0.4;
                }
                if (newX + elemW >= containerWidth) {
                    newX = containerWidth - elemW - 2;
                    obj.vx = -Math.abs(obj.vx) * (0.92 + Math.random() * 0.2);
                    obj.vx = Math.max(obj.vx, -2.5);
                    obj.vy = obj.vy + (Math.random() - 0.5) * 0.4;
                }
                if (newY <= 0) {
                    newY = 2;
                    obj.vy = Math.abs(obj.vy) * (0.92 + Math.random() * 0.2);
                    obj.vx = obj.vx + (Math.random() - 0.5) * 0.4;
                }
                if (newY + elemH >= containerHeight) {
                    newY = containerHeight - elemH - 2;
                    obj.vy = -Math.abs(obj.vy) * (0.92 + Math.random() * 0.2);
                    obj.vx = obj.vx + (Math.random() - 0.5) * 0.4;
                }
                
                // 限速但保持疯狂 (最大速度2.8)
                const maxSpeed = 2.8;
                obj.vx = Math.min(maxSpeed, Math.max(-maxSpeed, obj.vx));
                obj.vy = Math.min(maxSpeed, Math.max(-maxSpeed, obj.vy));
                
                obj.x = newX;
                obj.y = newY;
                obj.dom.style.left = `${obj.x}px`;
                obj.dom.style.top = `${obj.y}px`;
                
                // 旋转更新 (让文字飞行中翻转)
                let newRot = (obj.rotation || 0) + (obj.rotSpeed || 0.6);
                obj.rotation = newRot;
                obj.dom.style.transform = `rotate(${newRot % 360}deg)`;
            }
            
            animFrameId = requestAnimationFrame(updateMovement);
        }
        
        // 重置所有文字边界(窗口改变时重新适配)
        function handleWindowResize() {
            containerWidth = window.innerWidth;
            containerHeight = window.innerHeight;
            if (!wordsData.length) return;
            for (let w of wordsData) {
                if (!w.dom) continue;
                w.width = w.dom.offsetWidth;
                w.height = w.dom.offsetHeight;
                let newX = Math.min(Math.max(w.x, 2), containerWidth - w.width - 2);
                let newY = Math.min(Math.max(w.y, 2), containerHeight - w.height - 2);
                if (newX !== w.x) {
                    w.x = newX;
                    w.vx = -w.vx * 0.95;
                }
                if (newY !== w.y) {
                    w.y = newY;
                    w.vy = -w.vy * 0.95;
                }
                w.dom.style.left = `${w.x}px`;
                w.dom.style.top = `${w.y}px`;
            }
        }
        
        // 启动粉色大字狂欢派对 (隐藏视频 + 生成文字 + 乱飞)
        function startTaffyParty() {
            if (isPartyActive) return;
            isPartyActive = true;
            
            // 隐藏视频容器，优雅消失
            if (videoContainer && !videoContainer.classList.contains('hidden')) {
                videoContainer.classList.add('hidden');
            }
            
            // 清空之前的动画与文字，全新生成超多乱飞大字
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            
            // 重新生成满屏文字
            containerWidth = window.innerWidth;
            containerHeight = window.innerHeight;
            generateFloatingWords();
            handleWindowResize();  // 边界适配
            
            // 启动动画帧循环
            animFrameId = requestAnimationFrame(updateMovement);
            
            // 额外极度夸张特效：每隔1.2秒随机抽取10~15个文字放大闪烁+更换文字 (让画面更闹腾)
            let extraInterval = setInterval(() => {
                if (!isPartyActive) {
                    clearInterval(extraInterval);
                    return;
                }
                if (wordsData.length === 0) return;
                // 随机选 12~20 个字做膨胀特效
                const countToAnimate = Math.min(18, wordsData.length);
                const shuffled = [...wordsData].sort(() => 0.5 - Math.random());
                for (let i = 0; i < countToAnimate; i++) {
                    const target = shuffled[i];
                    if (target && target.dom) {
                        // 记录原本transform 但保留旋转
                        const originalTransition = target.dom.style.transition;
                        target.dom.style.transition = 'transform 0.12s ease, text-shadow 0.1s';
                        target.dom.style.transform = `rotate(${(target.rotation || 0) + 6}deg) scale(1.45)`;
                        target.dom.style.textShadow = "0 0 26px #ff55cc, 0 0 40px #ff44aa";
                        setTimeout(() => {
                            if (target.dom && isPartyActive) {
                                target.dom.style.transform = `rotate(${(target.rotation || 0)}deg) scale(1)`;
                                target.dom.style.textShadow = "0 0 16px #FF66AA, 0 0 30px #FF3399";
                                target.dom.style.transition = originalTransition || '';
                            }
                        }, 130);
                        
                        // 有概率改变文字内容增加塔菲疯魔
                        if (Math.random() > 0.65) {
                            const originalText = target.dom.innerText;
                            const newText = getRandomPhrase();
                            if (Math.random() > 0.3) target.dom.innerText = newText + " 💖";
                            else target.dom.innerText = newText;
                            // 但之后也可以恢复，但不必，让大字库自由更换更有活力
                            setTimeout(() => {
                                if (target.dom && Math.random() > 0.7 && isPartyActive) {
                                    target.dom.innerText = getRandomPhrase();
                                }
                            }, 600);
                        }
                    }
                }
                // 并且偶尔让个别字速度突变(调皮)
                for (let k = 0; k < 8; k++) {
                    const randomWord = wordsData[Math.floor(Math.random() * wordsData.length)];
                    if (randomWord) {
                        randomWord.vx += (Math.random() - 0.5) * 0.7;
                        randomWord.vy += (Math.random() - 0.5) * 0.7;
                        randomWord.vx = Math.min(2.8, Math.max(-2.8, randomWord.vx));
                        randomWord.vy = Math.min(2.8, Math.max(-2.8, randomWord.vy));
                    }
                }
            }, 1000);
            
            // 将interval存在window上以备不时之需（不用清理也可，但页面关闭自动清除）
            window.__taffyInterval = extraInterval;
        }
        
        // 绑定关闭按钮事件: 触发塔菲降临，同时确保视频关闭 + 粉色乱飞
        if (closeBtn) {
            closeBtn.addEventListener('click', () => {
                if (isPartyActive) {
                    // 如果已经激活, 但再按一次也无妨，不再重复生成但是可以额外增加更多文字来巩固疯狂
                    if (wordsData.length < 120) {
                        // 补一波额外大字，让屏幕更拥挤 (增加20个)
                        const extraCount = 25;
                        for (let i = 0; i < extraCount; i++) {
                            const wordEl = document.createElement('div');
                            wordEl.className = 'fly-word';
                            const randSize = getRandomSizeClass();
                            if (randSize) wordEl.classList.add(randSize);
                            wordEl.style.background = `linear-gradient(${120 + Math.random() * 60}deg, #FF80CC, #FF3399, #FFB3E6)`;
                            wordEl.style.backgroundClip = 'text';
                            wordEl.style.webkitBackgroundClip = 'text';
                            wordEl.style.color = 'transparent';
                            wordEl.innerText = getRandomPhrase();
                            const initX = Math.random() * containerWidth;
                            const initY = Math.random() * containerHeight;
                            wordEl.style.left = `${initX}px`;
                            wordEl.style.top = `${initY}px`;
                            wordEl.style.position = 'absolute';
                            floatingContainer.appendChild(wordEl);
                            wordsData.push({
                                dom: wordEl,
                                x: initX,
                                y: initY,
                                vx: randomRange(-1.6, 1.6),
                                vy: randomRange(-1.6, 1.6),
                                rotation: randomRange(-12, 12),
                                rotSpeed: randomRange(-1.6, 1.6),
                                width: wordEl.offsetWidth,
                                height: wordEl.offsetHeight
                            });
                        }
                    }
                    return;
                }
                // 首次启动狂欢派对
                startTaffyParty();
            });
        }
        
        // 窗口尺寸变化监听
        window.addEventListener('resize', () => {
            containerWidth = window.innerWidth;
            containerHeight = window.innerHeight;
            if (isPartyActive && wordsData.length) {
                handleWindowResize();
            }
        });
        
        // 预加载平滑处理，保证关闭视频按钮一直在可见区
        // 另外页面加载时如果用户想要直接点击按钮,完美触发, 且视频自动播放B站内容
        // 最终满足: 用户看完视频或任意时刻点击“关掉视频·塔菲降临” -> 隐藏B站视频 -> 满屏粉色夸张大字乱飞，文字内容全是“关注塔菲喵 关注塔菲谢谢喵”变体
        
        // 额外细节: 如果视频容器已经关闭后再也没有视频，按钮会继续喷射新的文字，完美符合需求
        console.log("✨ 塔菲喵能量就绪，点击右上角粉红按钮立刻触发满屏乱飞大字 ✨");
    })();
</script>
</body>
</html>
